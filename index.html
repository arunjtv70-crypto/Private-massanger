<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Private Messenger</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --navy: #0D1B2E;
    --gold: #C9A455;
    --bg2: #16273f;
    --text: #eaeef5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--navy); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 16px; background: var(--bg2); border-bottom: 1px solid var(--gold);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; color: var(--gold); }
  #auth-screen, #chat-screen { flex: 1; display: flex; flex-direction: column; padding: 16px; }
  input, button {
    padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #2a3d5c;
    background: #16273f; color: var(--text); font-size: 15px;
  }
  button {
    background: var(--gold); color: var(--navy); font-weight: bold; border: none; cursor: pointer;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; }
  .msg.sent { align-self: flex-end; background: var(--gold); color: var(--navy); }
  .msg.received { align-self: flex-start; background: var(--bg2); }
  .meta { font-size: 11px; opacity: 0.6; margin-top: 3px; }
  #chat-input { display: flex; gap: 8px; padding: 8px; }
  #chat-input input { flex: 1; margin: 0; }
  #chat-input button { margin: 0; }
  .hidden { display: none !important; }
  #status { font-size: 12px; opacity: 0.7; }
</style>
</head>
<body>

<header>
  <h1>🔒 Private Messenger</h1>
  <span id="status">offline</span>
</header>

<div id="auth-screen">
  <h3>Signup / Login (handle only — no phone number)</h3>
  <input id="handle" placeholder="@yourhandle" autocapitalize="off">
  <input id="password" type="password" placeholder="password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Log In</button>
  <p id="auth-error" style="color:#ff6b6b;"></p>
</div>

<div id="chat-screen" class="hidden">
  <input id="peer-handle" placeholder="Chat with @handle" onchange="loadKeyForPeer()">
  <div id="messages"></div>
  <div id="chat-input">
    <input id="msg-box" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
